<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MooTube - Busca: {{ termo }}</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background-color: rgb(240, 238, 238);
        font-family: Arial, Helvetica, sans-serif;
    }
    header {
        background: white;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        border-bottom: 2px solid #ddd;
        flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 22px; }
    header a {
        text-decoration: none;
        color: #333;
        background-image: url("/static/cow-texture.jpg");
        background-repeat: repeat;
        background-size: 60px;
        border: 2px solid #ccc;
        padding: 6px 16px;
        border-radius: 50px;
        font-size: 14px;
    }

    .wrap { max-width: 1100px; margin: 30px auto; padding: 0 16px; }
    .wrap h2 { text-align: center; color: #333; }

    .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 15px;
        width: 260px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .card a { display: block; line-height: 0; }

    .card img {
        width: 100%;
        border-radius: 10px;
        display: block;
        aspect-ratio: 16 / 9;
        object-fit: cover;
    }

    .card p {
        font-size: 14px;
        font-weight: bold;
        margin: 0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }

    .card small { color: #777; font-size: 12px; }

    .btn-baixar {
        background-image: url("/static/cow-texture.jpg");
        background-repeat: repeat;
        background-size: 60px;
        border: 2px solid #ccc;
        color: #333;
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 50px;
        cursor: pointer;
        width: 100%;
        margin-top: auto;
    }
    .btn-baixar[disabled] { opacity: 0.6; cursor: wait; }

    .vazio {
        text-align: center;
        color: #666;
        font-size: 15px;
        margin: 40px 0;
    }

    @media (max-width: 480px) {
        .card { width: 160px; padding: 10px; }
        .card p { font-size: 12px; }
    }
</style>
</head>
<body>
<header>
    <h1>🐮 MooTube</h1>
    <a href="/">⬅ Voltar</a>
</header>

<div class="wrap">
    <h2>🔍 Resultados para: {{ termo }}</h2>

    {% if resultados %}
    <div class="grid" id="grid">
        {% for r in resultados %}
        <div class="card">
            <a href="https://www.youtube.com/watch?v={{ r.id }}" target="_blank" rel="noopener">
                <img src="{{ r.thumb }}" alt="{{ r.titulo }}" loading="lazy">
            </a>
            <p title="{{ r.titulo }}">{{ r.titulo }}</p>
            <small>{{ r.canal }}</small>
            <button class="btn-baixar" data-id="{{ r.id }}">⬇️ Baixar</button>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="vazio">Nenhum resultado encontrado.</p>
    {% endif %}
</div>

<script>
document.querySelectorAll('.btn-baixar').forEach(btn => {
    btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = '⏳ Baixando...';

        try {
            const res = await fetch('/baixar_video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'video_id=' + encodeURIComponent(id)
            });
            const data = await res.json();
            if (data.ok) {
                btn.textContent = '✅ Baixado';
            } else {
                btn.textContent = '❌ ' + (data.erro || 'Erro');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.disabled = false;
                }, 2500);
            }
        } catch {
            btn.textContent = '❌ Falha';
            setTimeout(() => {
                btn.textContent = original;
                btn.disabled = false;
            }, 2500);
        }
    });
});
</script>
</body>
</html>
