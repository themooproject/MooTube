<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MooTube - Busca</title>
    <style>
        * { box-sizing: border-box; }

        input {
            display: block;
            margin: 0 auto;
            width: 800px;
            max-width: 100%;
            color: #000;
            font-size: larger;
            background-repeat: repeat;
            background-size: 60px;
            border-radius: 50px;
            text-align: right;
            background-image: url("/static/cow-texture.jpg");
        }
        button {
            display: block;
            margin: 0 auto;
            color: #000;
            font-size: larger;
            background-repeat: repeat;
            background-size: 60px;
            border-radius: 50px;
            text-align: center;
            background-image: url("/static/cow-texture.jpg");
            cursor: pointer;
        }
        body {
            background-repeat: repeat;
            background-size: 100px;
            margin: 0;
            background-color: rgb(240, 238, 238);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background-color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
        }

        h1 { margin: 0; }

        .videos {
            text-align: center;
            margin: 50px 20px;
        }

        .video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .video-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .video-card a { display: block; line-height: 0; }

        .video-card img {
            width: 100%;
            border-radius: 10px;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .video-card p {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .video-card small {
            color: #777;
            font-size: 12px;
        }

        .btn-baixar {
            background-image: url("/static/cow-texture.jpg");
            background-repeat: repeat;
            background-size: 60px;
            border: 2px solid #ccc;
            color: #333;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }
        .btn-baixar[disabled] { opacity: 0.6; cursor: wait; }

        .vazio {
            color: #666;
            font-size: 15px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            header {
                flex-wrap: wrap;
                gap: 8px;
                padding: 12px 10px;
                background: white !important;
                border-bottom: 2px solid #ddd;
            }
            header h1 {
                font-size: 20px;
                width: 100%;
                text-align: center;
                color: #333;
            }
            header input[type="search"] {
                width: 100% !important;
                height: 40px !important;
                font-size: 14px !important;
                text-align: center !important;
                border: 2px solid #ccc !important;
                color: #333 !important;
            }
            header form:first-of-type { width: 100%; margin: 0; }
            header form { display: inline-block; margin: 0; }
            header button {
                display: inline-block;
                padding: 6px 14px;
                font-size: 14px;
                margin: 0 2px;
                min-width: 40px;
                border: 2px solid #ccc !important;
                color: #333 !important;
                border-radius: 50px !important;
            }
            .videos { margin: 20px 10px; }
            .video-grid { gap: 12px; }
            .video-card { width: 220px; }
            .video-card p { font-size: 13px; }
            .btn-baixar { font-size: 13px; padding: 5px 12px; }
        }

        @media (max-width: 480px) {
            .video-card { width: 160px; padding: 10px; }
            header h1 { font-size: 17px; }
            header input[type="search"] {
                height: 36px !important;
                font-size: 13px !important;
            }
            header button { font-size: 13px; padding: 4px 10px; min-width: 34px; }
            .video-card p { font-size: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🐮 MooTube</h1>
        <form action="/pesquisar" method="get">
            <input type="search" name="busca" placeholder="Pesquisar vídeos..." value="{{ termo }}">
        </form>
        <form action="/" method="get">
            <button>🏠</button>
        </form>
    </header>

    <div class="videos">
        <h2>🔎 Resultados para "{{ termo }}"</h2>

        {% if not resultados %}
        <p class="vazio">Nada encontrado. Tente outra busca.</p>
        {% endif %}

        <div class="video-grid" id="resultados-grid">
            {% for r in resultados %}
            <div class="video-card">
                <a href="https://www.youtube.com/watch?v={{ r.id }}" target="_blank" rel="noopener">
                    <img src="{{ r.thumb }}" alt="{{ r.titulo }}" loading="lazy">
                </a>
                <p title="{{ r.titulo }}">{{ r.titulo }}</p>
                <small>{{ r.canal }}</small>
                <button class="btn-baixar" data-id="{{ r.id }}">⬇️ Baixar</button>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function bindBotoesBaixar() {
            document.querySelectorAll('.btn-baixar').forEach(btn => {
                if (btn.dataset.bound === '1') return;
                btn.dataset.bound = '1';

                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const original = btn.textContent;
                    btn.disabled = true;
                    btn.textContent = '⏳ Baixando...';

                    try {
                        const res = await fetch('/baixar_feed', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'video_id=' + encodeURIComponent(id)
                        });
                        const data = await res.json();

                        if (data.ok) {
                            btn.textContent = '✅ Baixado';
                        } else {
                            btn.textContent = '❌ ' + (data.erro || 'Erro');
                            setTimeout(() => {
                                btn.textContent = original;
                                btn.disabled = false;
                            }, 2500);
                        }
                    } catch {
                        btn.textContent = '❌ Falha';
                        setTimeout(() => {
                            btn.textContent = original;
                            btn.disabled = false;
                        }, 2500);
                    }
                });
            });
        }

        bindBotoesBaixar();
    </script>
</body>
</html>
